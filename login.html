<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Love Drop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="grain">
  <header class="topbar">
    <a class="brand" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21s-7.5-4.6-9.8-9.1C.6 8.6 2.3 5 5.7 5c2 0 3.3 1.1 4.3 2.4C11 6.1 12.3 5 14.3 5c3.4 0 5.1 3.6 3.5 6.9C15.5 16.4 12 21 12 21z" fill="#e4573d" opacity="0.9"/>
      </svg>
      Love Drop
    </a>
    <nav><a class="btn btn-quiet" href="/">Ghar jao</a></nav>
  </header>

  <main class="auth-wrap">
    <div class="card-glass auth-card" data-tilt>
      <h1 id="auth-title">Wapas aaye ho?</h1>
      <p class="auth-sub" id="auth-sub">Login karo, tumhare saare proposals yahin hain.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true">Login</button>
        <button class="tab" id="tab-signup" role="tab" aria-selected="false">Naya account</button>
      </div>

      <form id="auth-form" novalidate>
        <label class="field">
          <span class="lbl">Email</span>
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span class="lbl">Password</span>
          <input type="password" id="password" autocomplete="current-password" required>
          <span class="hint" id="pw-hint">Kam se kam 8 kaante</span>
        </label>
        <button class="btn btn-primary full" id="auth-btn" type="submit">Login karo</button>
        <p class="auth-err" id="auth-err" role="alert"></p>
      </form>
    </div>
  </main>

  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
