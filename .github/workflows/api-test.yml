name: API smoke test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run API tests
        run: |
          set -e
          API="https://ktzyncoafautqanxxeou.supabase.co/functions/v1/api"

          req() { # method url [data] [token]
            local M="$1" U="$2" D="$3" T="$4"
            local ARGS=(-s -w "\n%{http_code}" -X "$M" -H 'Content-Type: application/json')
            [ -n "$T" ] && ARGS+=(-H "Authorization: Bearer $T")
            [ -n "$D" ] && ARGS+=(-d "$D")
            curl "${ARGS[@]}" "$U"
          }
          check() { # expected_status actual_status label
            if [ "$2" != "$1" ]; then echo "FAIL: $3 -> expected $1, got $2"; exit 1; fi
            echo "PASS: $3 ($2)"
          }

          echo "== 1. me (anon) =="
          R=$(req GET "$API/auth/me"); echo "$R"
          check 200 "$(echo "$R" | tail -1)" "me anon"
          echo "$R" | head -1 | grep -q '"loggedIn":false' || { echo "FAIL: anon me wrong body"; exit 1; }

          echo "== 2. signup =="
          EMAIL="gh-test-$(date +%s)@lovedrop.invalid"
          R=$(req POST "$API/auth/signup" "{\"email\":\"$EMAIL\",\"password\":\"password123\"}")
          echo "$R" | head -1
          check 200 "$(echo "$R" | tail -1)" "signup"
          TOKEN=$(echo "$R" | head -1 | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          echo "token ok: ${TOKEN:0:12}..."

          echo "== 3. me (authed) =="
          R=$(req GET "$API/auth/me" "" "$TOKEN"); echo "$R"
          check 200 "$(echo "$R" | tail -1)" "me authed"

          echo "== 4. create proposal =="
          R=$(req POST "$API/proposals" '{"partner_name":"GH Test","questions":[{"q":"Q?","options":["a","b"]}],"reasons":["r1"],"note":"test note","final_question":"F?","theme":"rose"}' "$TOKEN")
          echo "$R" | head -1
          check 200 "$(echo "$R" | tail -1)" "create proposal"
          CODE=$(echo "$R" | head -1 | python3 -c "import sys,json;print(json.load(sys.stdin)['code'])")
          echo "code: $CODE"

          echo "== 5. public view =="
          R=$(req GET "$API/p/$CODE"); echo "$R" | head -c 300; echo
          check 200 "$(echo "$R" | tail -1)" "public view"
          echo "$R" | head -1 | grep -q '"note"' && { echo "FAIL: note leaked in public view"; exit 1; } || echo "PASS: no note leak"

          echo "== 6. secret pre-yes (expect 403) =="
          R=$(req GET "$API/p/$CODE/secret"); echo "$R"
          check 403 "$(echo "$R" | tail -1)" "secret locked"

          echo "== 7. dodge =="
          R=$(req POST "$API/p/$CODE/dodge" '{"count":5}'); echo "$R"
          check 200 "$(echo "$R" | tail -1)" "dodge"

          echo "== 8. answer YES =="
          R=$(req POST "$API/p/$CODE/answer" '{"answer":"yes"}'); echo "$R"
          check 200 "$(echo "$R" | tail -1)" "answer yes"

          echo "== 9. secret post-yes =="
          R=$(req GET "$API/p/$CODE/secret"); echo "$R"
          check 200 "$(echo "$R" | tail -1)" "secret unlocked"

          echo "== 10. reply =="
          R=$(req POST "$API/p/$CODE/reply" '{"text":"gh test reply"}'); echo "$R"
          check 200 "$(echo "$R" | tail -1)" "reply"

          echo "== 11. dashboard list =="
          R=$(req GET "$API/proposals" "" "$TOKEN"); echo "$R" | head -c 300; echo
          check 200 "$(echo "$R" | tail -1)" "dashboard list"

          echo "== 12. admin non-owner (expect 403) =="
          R=$(req GET "$API/admin/stats" "" "$TOKEN"); echo "$R"
          check 403 "$(echo "$R" | tail -1)" "admin locked"

          echo "== 13. bad login (expect 401) =="
          R=$(req POST "$API/auth/login" '{"email":"nope@x.y","password":"wrongpass"}')
          check 401 "$(echo "$R" | tail -1)" "bad login"

          echo "== 14. unauth list (expect 401) =="
          R=$(req GET "$API/proposals")
          check 401 "$(echo "$R" | tail -1)" "unauth list"

          echo "ALL_TESTS_PASSED"
